# The template's own check: every family's skeleton generated by bin/init, then validated, installed
# alone and tested (its conformance suite) and analysed as its CI would. Removed from a provider by
# bin/init.
name: template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  families:
    name: ${{ matrix.family }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/glitchr-studio/php:8.4
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        family: [omnimap]
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate
        run: |
          cp -R . /tmp/provider && cd /tmp/provider
          sh bin/init ${{ matrix.family }} example "Example" --author "Template Check" --email "ci@example.org"
          ! test -e skeleton
      - name: Validate, install, test, analyse
        working-directory: /tmp/provider
        run: |
          composer validate --no-check-publish --no-check-lock
          composer update --no-progress --prefer-dist
          vendor/bin/phpunit
          phpstan=phpstan; [ -x vendor/bin/phpstan ] && phpstan=vendor/bin/phpstan
          $phpstan analyse --no-progress --memory-limit=2G
